<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Markdown Reader</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.0/marked.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #1e1e1e;
      --bg2: #252526;
      --bg3: #2d2d30;
      --bg4: #3e3e42;
      --text: #cccccc;
      --text2: #9d9d9d;
      --text3: #6a6a6a;
      --border: #3e3e42;
      --accent: #4fc1ff;
      --accent-bg: #04395e;
      --active-file: #37373d;
      --hover: #2a2d2e;
      --icon-folder: #dcb67a;
      --icon-md: #519aba;
      --icon-txt: #9d9d9d;
      --icon-json: #f1e05a;
      --icon-other: #6d8086;
      --code-bg: #1a1a1a;
      --radius: 4px;
      --mono: 'Cascadia Code', 'Fira Code', 'Consolas', monospace;
      --sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      --sidebar-w: 240px;
      --outline-w: 220px;
    }

    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: var(--sans); font-size: 13px; overflow: hidden; }
    #app { display: flex; flex-direction: column; height: 100vh; }

    /* ── Activity bar (leftmost icon strip like VS Code) ── */
    #activity-bar {
      position: fixed; left: 0; top: 0; bottom: 0; width: 44px;
      background: var(--bg2); border-right: 1px solid var(--border);
      display: flex; flex-direction: column; align-items: center;
      padding: 8px 0; gap: 2px; z-index: 100;
    }
    .activity-btn {
      width: 36px; height: 36px; border: none; background: transparent;
      color: var(--text3); cursor: pointer; border-radius: var(--radius);
      display: flex; align-items: center; justify-content: center;
      transition: color 0.15s; position: relative;
    }
    .activity-btn:hover { color: var(--text); }
    .activity-btn.active { color: var(--text); }
    .activity-btn.active::before {
      content: ''; position: absolute; left: -4px; top: 50%; transform: translateY(-50%);
      width: 2px; height: 20px; background: var(--accent); border-radius: 0 2px 2px 0;
    }

    /* ── Layout ── */
    #layout { display: flex; flex: 1; margin-left: 44px; overflow: hidden; }

    /* ── Left panel (file explorer) ── */
    #file-panel {
      width: var(--sidebar-w); flex-shrink: 0; display: flex; flex-direction: column;
      background: var(--bg2); border-right: 1px solid var(--border);
      overflow: hidden; transition: width 0.2s ease;
    }
    #file-panel.collapsed { width: 0; border-right: none; }

    #file-panel-inner { width: var(--sidebar-w); display: flex; flex-direction: column; height: 100%; overflow: hidden; }

    .panel-title {
      padding: 10px 12px 6px; font-size: 10px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: var(--text2); flex-shrink: 0; display: flex;
      align-items: center; justify-content: space-between;
    }
    .panel-title-actions { display: flex; gap: 2px; }
    .panel-title-actions button {
      background: none; border: none; cursor: pointer; color: var(--text3);
      padding: 3px; border-radius: 3px; display: flex; align-items: center;
    }
    .panel-title-actions button:hover { color: var(--text); background: var(--bg4); }

    /* Empty state for file panel */
    #file-empty {
      flex: 1; display: flex; flex-direction: column; align-items: center;
      justify-content: center; gap: 12px; padding: 20px; text-align: center;
    }
    #file-empty svg { opacity: 0.2; }
    #file-empty p { font-size: 12px; color: var(--text3); line-height: 1.5; }
    #file-empty button {
      padding: 5px 14px; font-size: 12px; font-family: var(--sans);
      background: var(--accent-bg); color: var(--accent);
      border: 1px solid var(--accent); border-radius: var(--radius); cursor: pointer;
    }
    #file-empty button:hover { opacity: 0.85; }

    /* File tree */
    #file-tree { flex: 1; overflow-y: auto; padding-bottom: 8px; }

    /* Folder root label */
    #folder-root-label {
      display: flex; align-items: center; gap: 6px; padding: 6px 12px;
      font-size: 11px; font-weight: 600; color: var(--text2); cursor: pointer;
      user-select: none; border-bottom: 1px solid var(--border); flex-shrink: 0;
    }
    #folder-root-label:hover { background: var(--hover); }
    #folder-root-label svg { flex-shrink: 0; }
    #folder-root-label span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-transform: uppercase; letter-spacing: 0.05em; }

    /* Tree nodes */
    .tree-item {
      display: flex; align-items: center; gap: 0; padding: 2px 0;
      cursor: pointer; user-select: none; color: var(--text);
      transition: background 0.1s; position: relative; white-space: nowrap;
    }
    .tree-item:hover { background: var(--hover); }
    .tree-item.active-file { background: var(--active-file); }
    .tree-item.active-file::before {
      content: ''; position: absolute; left: 0; top: 0; bottom: 0;
      width: 2px; background: var(--accent);
    }

    .tree-indent { flex-shrink: 0; }
    .tree-chevron {
      width: 16px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;
      color: var(--text3); transition: transform 0.15s;
    }
    .tree-chevron.open { transform: rotate(90deg); }
    .tree-chevron.leaf { opacity: 0; pointer-events: none; }

    .tree-icon { width: 16px; flex-shrink: 0; margin-right: 5px; }
    .tree-name { overflow: hidden; text-overflow: ellipsis; font-size: 13px; flex: 1; padding-right: 8px; }
    .tree-item.is-dir .tree-name { color: var(--text); }
    .tree-item.is-md .tree-name { color: #c5c8c6; }

    /* ── Right panel (outline) ── */
    #outline-panel {
      width: var(--outline-w); flex-shrink: 0; display: flex; flex-direction: column;
      background: var(--bg2); border-left: 1px solid var(--border);
      overflow: hidden; transition: width 0.2s ease;
    }
    #outline-panel.collapsed { width: 0; border-left: none; }
    #outline-panel-inner { width: var(--outline-w); display: flex; flex-direction: column; height: 100%; overflow: hidden; }

    #outline-search { padding: 8px 10px; border-bottom: 1px solid var(--border); flex-shrink: 0; }
    #outline-search input {
      width: 100%; padding: 4px 8px; font-size: 12px; font-family: var(--sans);
      border: 1px solid var(--border); border-radius: var(--radius);
      background: var(--bg); color: var(--text); outline: none;
    }
    #outline-search input:focus { border-color: var(--accent); }
    #outline-search input::placeholder { color: var(--text3); }

    #outline-list { flex: 1; overflow-y: auto; padding: 4px 0; }
    #outline-empty { padding: 16px; font-size: 12px; color: var(--text3); text-align: center; }

    .outline-item {
      display: flex; align-items: center; padding: 3px 0 3px 0;
      cursor: pointer; border: none; background: none; width: 100%;
      text-align: left; font-family: var(--sans); color: var(--text2);
      font-size: 12px; line-height: 1.4; transition: background 0.1s, color 0.1s;
    }
    .outline-item:hover { background: var(--hover); color: var(--text); }
    .outline-item.active { background: var(--accent-bg); color: var(--accent); }
    .outline-dot { flex-shrink: 0; width: 4px; height: 4px; border-radius: 50%; background: currentColor; opacity: 0.6; margin-right: 7px; }
    .outline-label { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

    /* ── Main content ── */
    #main { display: flex; flex-direction: column; flex: 1; min-width: 0; overflow: hidden; }

    /* Tabs bar */
    #tabs {
      display: flex; align-items: stretch; background: var(--bg2);
      border-bottom: 1px solid var(--border); flex-shrink: 0; overflow-x: auto;
      scrollbar-width: none;
    }
    #tabs::-webkit-scrollbar { display: none; }

    .tab {
      display: flex; align-items: center; gap: 6px; padding: 0 14px;
      height: 35px; border-right: 1px solid var(--border); cursor: pointer;
      color: var(--text3); font-size: 12.5px; white-space: nowrap;
      flex-shrink: 0; transition: background 0.1s, color 0.1s;
      position: relative; max-width: 180px;
    }
    .tab:hover { background: var(--bg3); color: var(--text2); }
    .tab.active { background: var(--bg); color: var(--text); }
    .tab.active::after {
      content: ''; position: absolute; bottom: 0; left: 0; right: 0;
      height: 1px; background: var(--accent);
    }
    .tab-name { overflow: hidden; text-overflow: ellipsis; flex: 1; }
    .tab-close {
      width: 16px; height: 16px; border-radius: 3px; border: none; background: none;
      color: var(--text3); cursor: pointer; display: flex; align-items: center;
      justify-content: center; flex-shrink: 0; font-size: 14px; line-height: 1;
      opacity: 0; transition: opacity 0.1s, background 0.1s;
    }
    .tab:hover .tab-close, .tab.active .tab-close { opacity: 1; }
    .tab-close:hover { background: var(--bg4); color: var(--text); }

    #tabs-placeholder {
      flex: 1; display: flex; align-items: center; padding: 0 12px;
      font-size: 12px; color: var(--text3);
    }

    /* Toolbar */
    #toolbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 5px 12px; background: var(--bg2); border-bottom: 1px solid var(--border);
      flex-shrink: 0; gap: 10px;
    }
    .btn-group { display: flex; gap: 2px; background: var(--bg3); border: 1px solid var(--border); border-radius: var(--radius); padding: 2px; }
    .btn-group button { padding: 3px 10px; font-size: 11px; font-family: var(--sans); border: none; border-radius: 3px; background: transparent; color: var(--text3); cursor: pointer; }
    .btn-group button:hover { background: var(--bg4); color: var(--text2); }
    .btn-group button.active { background: var(--bg4); color: var(--text); }

    .tbtn { display: flex; align-items: center; gap: 4px; padding: 4px 10px; font-size: 11px; font-family: var(--sans); border: 1px solid var(--border); border-radius: var(--radius); background: transparent; color: var(--text3); cursor: pointer; white-space: nowrap; }
    .tbtn:hover { background: var(--bg3); color: var(--text2); }
    .file-label { display: flex; align-items: center; gap: 4px; padding: 4px 10px; font-size: 11px; font-family: var(--sans); border: 1px solid var(--border); border-radius: var(--radius); background: transparent; color: var(--text3); cursor: pointer; white-space: nowrap; }
    .file-label:hover { background: var(--bg3); color: var(--text2); }

    /* Panes */
    #panes { display: flex; flex: 1; overflow: hidden; }
    .pane { display: flex; flex-direction: column; flex: 1; min-width: 0; overflow: hidden; }
    #editor-pane { border-right: 1px solid var(--border); }
    .pane-header { padding: 3px 14px; font-size: 10px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text3); background: var(--bg2); border-bottom: 1px solid var(--border); flex-shrink: 0; }

    #editor { flex: 1; width: 100%; padding: 16px 20px; border: none; outline: none; resize: none; font-family: var(--mono); font-size: 13px; line-height: 1.75; color: var(--text); background: var(--bg); tab-size: 2; caret-color: var(--accent); }
    #preview-scroll { flex: 1; overflow-y: auto; padding: 24px 32px; background: var(--bg); scroll-behavior: smooth; }

    /* Status bar */
    #statusbar {
      padding: 2px 14px 2px 56px; border-top: 1px solid var(--border);
      background: #007acc; display: flex; gap: 16px; flex-shrink: 0; align-items: center;
    }
    #statusbar span { font-size: 11px; color: rgba(255,255,255,0.85); }
    #status-file { margin-right: auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 300px; }

    /* Preview typography */
    #preview { color: var(--text); }
    #preview h1 { font-size: 22px; font-weight: 600; margin: 0 0 14px; padding-bottom: 8px; border-bottom: 1px solid var(--border); color: #e0e0e0; }
    #preview h2 { font-size: 18px; font-weight: 600; margin: 24px 0 10px; color: #e0e0e0; }
    #preview h3 { font-size: 15px; font-weight: 600; margin: 20px 0 8px; color: #e0e0e0; }
    #preview h4, #preview h5, #preview h6 { font-size: 13px; font-weight: 600; margin: 16px 0 6px; color: #e0e0e0; }
    #preview p { margin: 0 0 12px; line-height: 1.75; font-size: 14px; }
    #preview ul, #preview ol { margin: 0 0 12px; padding-left: 22px; font-size: 14px; line-height: 1.75; }
    #preview li { margin-bottom: 4px; }
    #preview code { font-family: var(--mono); font-size: 12px; background: var(--code-bg); padding: 2px 5px; border-radius: 3px; color: #ce9178; border: 1px solid var(--border); }
    #preview pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; overflow-x: auto; margin: 0 0 16px; }
    #preview pre code { background: none; padding: 0; border: none; font-size: 12px; line-height: 1.6; color: var(--text); }
    #preview blockquote { margin: 0 0 16px; padding: 10px 16px; border-left: 3px solid var(--text3); background: var(--bg2); }
    #preview blockquote p { margin: 0; color: var(--text2); font-style: italic; }
    #preview hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }
    #preview a { color: var(--accent); text-decoration: none; }
    #preview a:hover { text-decoration: underline; }
    #preview table { width: 100%; border-collapse: collapse; margin: 0 0 16px; font-size: 13px; }
    #preview th { background: var(--bg2); font-weight: 600; text-align: left; padding: 7px 12px; border: 1px solid var(--border); color: #e0e0e0; }
    #preview td { padding: 6px 12px; border: 1px solid var(--border); }
    #preview tr:nth-child(even) td { background: var(--bg2); }
    #preview img { max-width: 100%; border-radius: var(--radius); }
    #preview strong { color: #e0e0e0; font-weight: 600; }

    #empty-state { display: none; flex-direction: column; align-items: center; justify-content: center; height: 100%; gap: 10px; color: var(--text3); font-size: 13px; }
    #empty-state svg { opacity: 0.2; }

    /* Scrollbars */
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--bg4); border-radius: 4px; }
    ::-webkit-scrollbar-thumb:hover { background: #555; }
  </style>
</head>
<body>
<div id="app">

  <!-- Activity bar -->
  <div id="activity-bar">
    <button class="activity-btn active" id="act-files" onclick="activatePanel('files')" title="File Explorer (Ctrl+Shift+E)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
    </button>
    <button class="activity-btn" id="act-outline" onclick="activatePanel('outline')" title="Outline (Ctrl+\)">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="15" y2="12"/><line x1="3" y1="18" x2="18" y2="18"/></svg>
    </button>
  </div>

  <div id="layout">

    <!-- File explorer panel -->
    <div id="file-panel">
      <div id="file-panel-inner">
        <div class="panel-title">
          Explorer
          <div class="panel-title-actions">
            <button onclick="openFolder()" title="Open Folder">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
            </button>
            <button onclick="collapseAll()" title="Collapse All">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
            </button>
          </div>
        </div>

        <div id="file-empty">
          <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
          <p>No folder open.<br>Open a folder to browse your files.</p>
          <button onclick="openFolder()">Open Folder</button>
        </div>

        <div id="folder-root-label" style="display:none" onclick="toggleRootCollapse()">
          <svg id="root-chevron" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="transition:transform 0.15s"><polyline points="9 18 15 12 9 6"/></svg>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="color:var(--icon-folder)"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>
          <span id="folder-root-name">FOLDER</span>
        </div>

        <div id="file-tree" style="display:none"></div>
      </div>
    </div>

    <!-- Main area -->
    <div id="main">

      <!-- Tabs -->
      <div id="tabs">
        <div id="tabs-placeholder">No file open &mdash; open a file or folder</div>
      </div>

      <!-- Toolbar -->
      <div id="toolbar">
        <div class="btn-group" role="group">
          <button id="btn-split" class="active" onclick="setMode('split')">Split</button>
          <button id="btn-editor" onclick="setMode('editor')">Edit</button>
          <button id="btn-preview" onclick="setMode('preview')">Preview</button>
        </div>
        <div style="display:flex;gap:6px;align-items:center;">
          <label class="file-label" title="Open file">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M17 8l-5-5-5 5M12 3v12"/></svg>
            Open File
            <input type="file" accept=".md,.txt,.markdown" style="display:none" onchange="loadFilePicker(event)">
          </label>
          <button class="tbtn" onclick="copySource()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>
            Copy
          </button>
          <button class="tbtn" onclick="downloadHtml()">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 01-2 2H5a2 2 0 01-2-2v-4M7 10l5 5 5-5M12 15V3"/></svg>
            Export
          </button>
        </div>
      </div>

      <!-- Editor + Preview -->
      <div id="panes">
        <div class="pane" id="editor-pane">
          <div class="pane-header">Markdown</div>
          <textarea id="editor" oninput="render()" placeholder="Paste or type markdown, or open a file from the explorer…" spellcheck="false"></textarea>
        </div>
        <div class="pane" id="preview-pane">
          <div class="pane-header">Preview</div>
          <div id="preview-scroll">
            <div id="preview"></div>
            <div id="empty-state">
              <svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
              <p>Nothing to preview</p>
            </div>
          </div>
        </div>
      </div>

    </div>

    <!-- Outline panel (right) -->
    <div id="outline-panel" class="collapsed">
      <div id="outline-panel-inner">
        <div class="panel-title">
          Outline
          <div class="panel-title-actions">
            <button onclick="activatePanel('outline')" title="Close">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
          </div>
        </div>
        <div id="outline-search">
          <input type="text" id="outline-filter" placeholder="Filter headings…" oninput="buildOutline(this.value)" aria-label="Filter headings">
        </div>
        <div id="outline-list">
          <div id="outline-empty">No headings</div>
        </div>
      </div>
    </div>

  </div>

  <!-- Status bar -->
  <div id="statusbar">
    <span id="status-file">No file open</span>
    <span id="stat-words">0 words</span>
    <span id="stat-lines">0 lines</span>
    <span id="stat-chars">0 chars</span>
  </div>

</div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let currentMode = 'split'
let activePanel = 'files'  // 'files' | 'outline' | null
let headings = []
let openTabs = []          // [{ name, path, content }]
let activeTabIndex = -1
let currentFilePath = null
let rootCollapsed = false
let expandedDirs = new Set()

const isElectron = typeof window.api !== 'undefined'

// ── Panel toggle ──────────────────────────────────────────────────────────────
function activatePanel(panel) {
  if (activePanel === panel) {
    // toggle off
    activePanel = null
    document.getElementById('file-panel').classList.add('collapsed')
    document.getElementById('outline-panel').classList.add('collapsed')
    document.getElementById('act-files').classList.remove('active')
    document.getElementById('act-outline').classList.remove('active')
    return
  }
  activePanel = panel
  const showFiles = panel === 'files'
  document.getElementById('file-panel').classList.toggle('collapsed', !showFiles)
  document.getElementById('outline-panel').classList.toggle('collapsed', showFiles)
  document.getElementById('act-files').classList.toggle('active', showFiles)
  document.getElementById('act-outline').classList.toggle('active', !showFiles)
}

function toggleOutline() { activatePanel('outline') }
function toggleFiles()   { activatePanel('files') }

// ── Folder / file tree ────────────────────────────────────────────────────────
async function openFolder() {
  let dirPath
  if (isElectron) {
    dirPath = await window.api.openFolder()
  } else {
    // Fallback: not in Electron
    alert('Folder opening requires the Electron app.')
    return
  }
  if (!dirPath) return
  loadFolderTree(dirPath)
}

async function loadFolderTree(dirPath) {
  const tree = await window.api.readDir(dirPath)
  document.getElementById('file-empty').style.display = 'none'
  const rootLabel = document.getElementById('folder-root-label')
  rootLabel.style.display = 'flex'
  document.getElementById('folder-root-name').textContent = tree.name.toUpperCase()
  document.getElementById('file-tree').style.display = 'block'
  rootCollapsed = false
  updateRootChevron()
  renderTree(tree.children, dirPath)
}

function updateRootChevron() {
  const ch = document.getElementById('root-chevron')
  ch.style.transform = rootCollapsed ? 'rotate(-90deg)' : 'rotate(90deg)'
  document.getElementById('file-tree').style.display = rootCollapsed ? 'none' : 'block'
}

function toggleRootCollapse() {
  rootCollapsed = !rootCollapsed
  updateRootChevron()
}

function collapseAll() {
  expandedDirs.clear()
  const allSubtrees = document.querySelectorAll('.tree-children')
  allSubtrees.forEach(el => el.style.display = 'none')
  document.querySelectorAll('.tree-chevron').forEach(ch => ch.classList.remove('open'))
}

function getFileIcon(ext) {
  const icons = {
    '.md': `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--icon-md)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/></svg>`,
    '.markdown': `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--icon-md)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/></svg>`,
    '.txt': `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--icon-txt)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/><polyline points="10 9 9 9 8 9"/></svg>`,
    '.json': `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--icon-json)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/></svg>`,
  }
  return icons[ext] || `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--icon-other)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/></svg>`
}

const folderIconOpen = `<svg width="14" height="14" viewBox="0 0 24 24" fill="var(--icon-folder)" stroke="none"><path d="M22 19a2 2 0 01-2 2H4a2 2 0 01-2-2V5a2 2 0 012-2h5l2 3h9a2 2 0 012 2z"/></svg>`

function renderTree(nodes, basePath, container, depth) {
  const target = container || document.getElementById('file-tree')
  if (!container) target.innerHTML = ''
  depth = depth || 0

  nodes.forEach(node => {
    const item = document.createElement('div')
    item.className = 'tree-item' + (node.isDir ? ' is-dir' : '') + (!node.isDir && ['.md','.markdown','.txt'].includes(node.ext) ? ' is-md' : '')
    item.style.paddingLeft = (depth * 12 + 4) + 'px'

    const chevron = document.createElement('span')
    chevron.className = 'tree-chevron ' + (node.isDir ? '' : 'leaf')
    chevron.innerHTML = `<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`
    if (node.isDir && expandedDirs.has(node.path)) chevron.classList.add('open')

    const icon = document.createElement('span')
    icon.className = 'tree-icon'
    icon.innerHTML = node.isDir ? folderIconOpen : getFileIcon(node.ext)

    const name = document.createElement('span')
    name.className = 'tree-name'
    name.textContent = node.name

    item.appendChild(chevron)
    item.appendChild(icon)
    item.appendChild(name)
    target.appendChild(item)

    if (node.isDir && node.children) {
      const subtree = document.createElement('div')
      subtree.className = 'tree-children'
      subtree.style.display = expandedDirs.has(node.path) ? 'block' : 'none'
      target.appendChild(subtree)

      item.addEventListener('click', () => {
        const open = expandedDirs.has(node.path)
        if (open) { expandedDirs.delete(node.path); subtree.style.display = 'none'; chevron.classList.remove('open') }
        else { expandedDirs.add(node.path); subtree.style.display = 'block'; chevron.classList.add('open') }
      })

      renderTree(node.children, node.path, subtree, depth + 1)
    } else if (!node.isDir) {
      item.addEventListener('click', () => openFileFromTree(node))
    }
  })
}

async function openFileFromTree(node) {
  // Mark active
  document.querySelectorAll('.tree-item').forEach(el => el.classList.remove('active-file'))
  event && event.currentTarget && event.currentTarget.classList.add('active-file')

  let content
  if (isElectron) {
    content = await window.api.readFile(node.path)
  }
  loadContent(content, node.path, node.name)
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
function loadContent(content, filePath, name) {
  // Check if already open
  const existing = openTabs.findIndex(t => t.path === filePath)
  if (existing !== -1) { switchTab(existing); return }

  openTabs.push({ name: name || filePath.split(/[\\/]/).pop(), path: filePath, content })
  switchTab(openTabs.length - 1)
  renderTabs()
}

function switchTab(index) {
  if (index < 0 || index >= openTabs.length) return
  // Save current tab content
  if (activeTabIndex >= 0 && activeTabIndex < openTabs.length) {
    openTabs[activeTabIndex].content = document.getElementById('editor').value
  }
  activeTabIndex = index
  currentFilePath = openTabs[index].path
  document.getElementById('editor').value = openTabs[index].content
  document.getElementById('status-file').textContent = openTabs[index].path
  render()
  renderTabs()
}

function closeTab(index, e) {
  e && e.stopPropagation()
  openTabs.splice(index, 1)
  if (openTabs.length === 0) {
    activeTabIndex = -1
    currentFilePath = null
    document.getElementById('editor').value = ''
    document.getElementById('status-file').textContent = 'No file open'
    render()
    renderTabs()
    return
  }
  const newIndex = Math.min(index, openTabs.length - 1)
  activeTabIndex = -1  // force re-load
  switchTab(newIndex)
}

function renderTabs() {
  const tabsEl = document.getElementById('tabs')
  const placeholder = document.getElementById('tabs-placeholder')

  if (openTabs.length === 0) {
    tabsEl.innerHTML = ''
    tabsEl.appendChild(placeholder)
    placeholder.style.display = 'flex'
    return
  }
  placeholder.style.display = 'none'
  tabsEl.innerHTML = ''

  openTabs.forEach((tab, i) => {
    const el = document.createElement('div')
    el.className = 'tab' + (i === activeTabIndex ? ' active' : '')
    el.title = tab.path

    const nameEl = document.createElement('span')
    nameEl.className = 'tab-name'
    nameEl.textContent = tab.name

    const closeEl = document.createElement('button')
    closeEl.className = 'tab-close'
    closeEl.innerHTML = '×'
    closeEl.title = 'Close'
    closeEl.addEventListener('click', (e) => closeTab(i, e))

    el.appendChild(nameEl)
    el.appendChild(closeEl)
    el.addEventListener('click', () => switchTab(i))
    tabsEl.appendChild(el)
  })
  tabsEl.appendChild(placeholder)
}

// ── Outline ───────────────────────────────────────────────────────────────────
function slugify(text) {
  return text.toLowerCase().replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-') || 'heading'
}

function buildOutline(filter) {
  const list = document.getElementById('outline-list')
  const empty = document.getElementById('outline-empty')
  filter = (filter || '').toLowerCase()
  const visible = filter ? headings.filter(h => h.text.toLowerCase().includes(filter)) : headings

  Array.from(list.children).forEach(c => { if (c !== empty) c.remove() })
  if (visible.length === 0) { empty.style.display = 'block'; return }
  empty.style.display = 'none'

  visible.forEach(h => {
    const btn = document.createElement('button')
    btn.className = 'outline-item'
    btn.dataset.id = h.id
    btn.title = h.text

    const indent = document.createElement('span')
    indent.style.cssText = `flex-shrink:0;width:${(h.level - 1) * 10 + 8}px`

    const dot = document.createElement('span')
    dot.className = 'outline-dot'
    dot.style.cssText = `width:${Math.max(3,5-h.level)}px;height:${Math.max(3,5-h.level)}px`

    const label = document.createElement('span')
    label.className = 'outline-label'
    label.style.fontSize = h.level === 1 ? '12.5px' : '12px'
    label.textContent = h.text

    btn.appendChild(indent); btn.appendChild(dot); btn.appendChild(label)
    btn.addEventListener('click', () => scrollToHeading(h.id))
    list.appendChild(btn)
  })
  updateActiveOutline()
}

function scrollToHeading(id) {
  const target = document.getElementById(id)
  if (!target) return
  if (currentMode === 'editor') setMode('split')
  document.getElementById('preview-scroll').scrollTo({ top: target.offsetTop - 24, behavior: 'smooth' })
}

function updateActiveOutline() {
  const scroll = document.getElementById('preview-scroll')
  const scrollTop = scroll.scrollTop + 60
  let activeId = null
  headings.forEach(h => { const el = document.getElementById(h.id); if (el && el.offsetTop <= scrollTop) activeId = h.id })
  document.querySelectorAll('.outline-item').forEach(btn => { btn.classList.toggle('active', btn.dataset.id === activeId) })
}
document.getElementById('preview-scroll').addEventListener('scroll', updateActiveOutline)

// ── Render ────────────────────────────────────────────────────────────────────
function render() {
  const src = document.getElementById('editor').value
  const preview = document.getElementById('preview')
  const empty = document.getElementById('empty-state')

  if (src.trim()) {
    preview.innerHTML = marked.parse(src)
    preview.style.display = 'block'
    empty.style.display = 'none'
    headings = []
    const counts = {}
    preview.querySelectorAll('h1,h2,h3,h4,h5,h6').forEach(el => {
      const text = el.textContent.trim()
      let slug = slugify(text)
      counts[slug] = (counts[slug] || 0) + 1
      if (counts[slug] > 1) slug += '-' + counts[slug]
      el.id = slug
      headings.push({ level: parseInt(el.tagName[1]), text, id: slug })
    })
  } else {
    preview.innerHTML = ''; preview.style.display = 'none'; empty.style.display = 'flex'
    headings = []
  }

  buildOutline(document.getElementById('outline-filter').value)

  const words = src.trim() ? src.trim().split(/\s+/).length : 0
  const lines = src ? src.split('\n').length : 0
  document.getElementById('stat-words').textContent = words + ' word' + (words !== 1 ? 's' : '')
  document.getElementById('stat-lines').textContent = lines + ' line' + (lines !== 1 ? 's' : '')
  document.getElementById('stat-chars').textContent = src.length + ' char' + (src.length !== 1 ? 's' : '')
}

// ── View mode ─────────────────────────────────────────────────────────────────
function setMode(mode) {
  currentMode = mode
  const ep = document.getElementById('editor-pane')
  const pp = document.getElementById('preview-pane')
  ep.style.display = mode === 'preview' ? 'none' : 'flex'
  pp.style.display = mode === 'editor' ? 'none' : 'flex'
  ep.style.borderRight = mode === 'split' ? '1px solid var(--border)' : 'none'
  ;['split','editor','preview'].forEach(m => { document.getElementById('btn-'+m).classList.toggle('active', m === mode) })
}

// ── File actions ──────────────────────────────────────────────────────────────
function loadFilePicker(e) {
  const file = e.target.files[0]; if (!file) return
  const reader = new FileReader()
  reader.onload = ev => loadContent(ev.target.result, file.name, file.name)
  reader.readAsText(file)
  e.target.value = ''
}

function copySource() {
  navigator.clipboard.writeText(document.getElementById('editor').value).then(() => {
    const btns = document.querySelectorAll('.tbtn')
    btns.forEach(b => { if (b.textContent.includes('Copy')) { b.textContent = '✓ Copied!'; setTimeout(() => { b.innerHTML = '<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg> Copy'; }, 1500) } })
  })
}

function downloadHtml() {
  const body = marked.parse(document.getElementById('editor').value)
  const html = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Export</title><style>body{max-width:720px;margin:60px auto;padding:0 24px;font-family:-apple-system,sans-serif;font-size:16px;line-height:1.75;color:#1a1a1a}h1,h2,h3{font-weight:600;margin:1.5em 0 .5em}h1{font-size:2em;border-bottom:1px solid #e0e0dc;padding-bottom:.3em}code{font-family:Consolas,monospace;font-size:.875em;background:#f3f3f1;padding:2px 6px;border-radius:4px}pre{background:#f3f3f1;border:1px solid #e0e0dc;border-radius:8px;padding:16px;overflow-x:auto}pre code{background:none;padding:0}blockquote{border-left:3px solid #c8c8c4;margin:0 0 1em;padding:10px 16px;background:#f6f6f4}table{width:100%;border-collapse:collapse;margin-bottom:1em}th,td{padding:8px 14px;border:1px solid #e0e0dc;text-align:left}th{background:#f6f6f4;font-weight:600}a{color:#3b82f6}</style></head><body>${body}</body></html>`
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([html],{type:'text/html'})); a.download='document.html'; a.click()
}

// ── Electron API listeners ─────────────────────────────────────────────────────
if (isElectron) {
  window.api.onMenuOpenFile((content, filePath) => {
    const name = filePath.split(/[\\/]/).pop()
    loadContent(content, filePath, name)
  })
  window.api.onMenuExport(() => downloadHtml())
  window.api.onMenuSetMode((mode) => setMode(mode))
  window.api.onMenuToggleOutline(() => activatePanel('outline'))
  window.api.onMenuToggleFiles(() => activatePanel('files'))
  window.api.onMenuSave(async () => {
    if (!currentFilePath || !isElectron) return
    const content = document.getElementById('editor').value
    await window.api.saveFile(currentFilePath, content)
  })

  // Handle folder opened from menu
  const { ipcRenderer } = window.api
  window.addEventListener('DOMContentLoaded', () => {})
}

// ── Editor keyboard shortcuts ─────────────────────────────────────────────────
document.getElementById('editor').addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    e.preventDefault()
    const ta = e.target, s = ta.selectionStart
    ta.value = ta.value.substring(0, s) + '  ' + ta.value.substring(ta.selectionEnd)
    ta.selectionStart = ta.selectionEnd = s + 2
    render()
  }
})

// ── Init ──────────────────────────────────────────────────────────────────────
renderTabs()
render()
</script>
